name: Build and safety checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/FiveMCleaner/FiveMCleaner.csproj -c Release
      - run: dotnet run --project tests/SafetyChecks -c Release
      - if: runner.os == 'Windows'
        run: dotnet run --project tests/WindowsChecks -c Release
      - if: runner.os == 'Windows'
        run: dotnet publish src/FiveMCleaner/FiveMCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-Deep-Clean-Manager-win-x64
          path: artifacts/win-x64/
